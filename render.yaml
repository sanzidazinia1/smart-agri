# Render cron job that sends waiting Telegram alerts every 5 min (secrets set on Render).
services:
  - type: cron
    name: smartagriai-telegram-delivery
    runtime: node
    schedule: "*/5 * * * *"
    buildCommand: npm ci
    startCommand: npm run telegram:worker
    envVars:
      - key: DATABASE_URL
        sync: false
      # Same as the web app: decrypts each user's saved bot token
      - key: AUTH_SECRET
        sync: false
